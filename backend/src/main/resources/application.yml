spring:
  application:
    name: casal-financeiro
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    # explicit: Hibernate doesn't need a live connection at boot to pick the dialect
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    # Off: with it on, every request holds a DB connection from its first query until the response is
    # written (incl. the bcrypt hash on register) and 10 pooled connections run out under load.
    open-in-view: false
    show-sql: false
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET} # obrigatório (>= 32 bytes); sem default para produção não subir com chave conhecida
    expiration: ${JWT_EXPIRATION_MS:43200000} # 12 horas
  mail:
    from: ${MAIL_FROM:${SMTP_USER:no-reply@financeiro-casal.local}}
  email-verification:
    expiration-minutes: ${EMAIL_VERIFICATION_EXP_MIN:15}
  ai:
    # cifra as chaves de API dos usuários (assistente). Sem AI_KEY_SECRET, deriva do JWT_SECRET —
    # nesse caso, trocar o JWT_SECRET obriga cada usuário a colar a chave de novo.
    secret: ${AI_KEY_SECRET:${app.jwt.secret}}
  # Assistente no Telegram (opcional): crie o bot no @BotFather. Com APP_PUBLIC_URL, o webhook é registrado no boot.
  telegram:
    token: ${TELEGRAM_BOT_TOKEN:}
    secret: ${TELEGRAM_WEBHOOK_SECRET:}
    bot-username: ${TELEGRAM_BOT_USERNAME:}
  public-url: ${APP_PUBLIC_URL:}

# Actuator (kept under /api to match the frontend and deploy config)
management:
  endpoints:
    web:
      base-path: /api/actuator

# CORS — "*" por padrão (API só com token, sem cookies). Restrinja com CORS_ALLOWED_ORIGINS.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

logging:
  # rid = request id (also in the X-Request-Id header and error bodies), uid = logged-in user
  pattern:
    level: "%5p [rid=%X{rid:-} uid=%X{uid:-}]"
  level:
    root: INFO
    com.financeiro.casal: ${LOG_LEVEL:INFO}
    org.springframework.web: INFO
    # SQL tracing on demand: LOG_SQL=DEBUG
    org.hibernate.SQL: ${LOG_SQL:WARN}
