# Local development profile: file-based H2 (persiste entre reinícios), sem Supabase.
# Run: mvnw spring-boot:run -Dspring-boot.run.profiles=local
# Não há usuário de exemplo — cadastre-se na primeira vez (igual à produção).
spring:
  datasource:
    url: jdbc:h2:file:./.localdb/financeiro;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=LEGACY
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}

# Sem SMTP configurado, o código de troca de e-mail aparece no log.
management:
  health:
    mail:
      enabled: false
