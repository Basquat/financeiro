# Profile used by ApiIntegrationTest — throwaway in-memory H2, recriada a cada run.
spring:
  sql:
    init:
      mode: never
  datasource:
    url: jdbc:h2:mem:financeiro-test;DB_CLOSE_DELAY=-1;MODE=LEGACY
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

management:
  health:
    mail:
      enabled: false
